version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: orca_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=true
      - DATABASE_URL=postgresql+asyncpg://orca_user:orca_secure_password@postgres:5432/orca_marine
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.3
    container_name: orca_postgres
    environment:
      POSTGRES_USER: orca_user
      POSTGRES_PASSWORD: orca_secure_password
      POSTGRES_DB: orca_marine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: orca_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
