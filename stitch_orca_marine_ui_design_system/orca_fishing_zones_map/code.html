<script>
  // Simple interactive mock state to toggle zones smoothly
  const zoneData = {
    'A12': {
      id: 'ZONE A-12',
      distance: '12 km Southwest',
      badge: 'HIGH POTENTIAL',
      course: '218° SSW',
      depth: '44m Water'
    },
    'B04': {
      id: 'ZONE B-04',
      distance: '18 km West',
      badge: 'MODERATE',
      course: '264° W',
      depth: '58m Water'
    },
    'C09': {
      id: 'ZONE C-09',
      distance: '24 km Northwest',
      badge: 'NORMAL POTENTIAL',
      course: '312° NW',
      depth: '62m Water'
    },
    'vessel': {
      id: 'SEA KING II',
      distance: '0 km (Current Position)',
      badge: 'GPS LOCKED',
      course: 'Current 218°',
      depth: '18m Harbor'
    }
  };

  function selectZone(code) {
    const data = zoneData[code];
    if (!data) return;
    document.getElementById('sheet-zone-id').innerText = data.id;
    document.getElementById('sheet-distance').innerText = data.distance;
    document.getElementById('sheet-badge').innerText = data.badge;
    document.getElementById('telemetry-course').innerText = data.course;
    document.getElementById('telemetry-depth').innerText = data.depth;
  }

  function handleViewDetails() {
    const zoneName = document.getElementById('sheet-zone-id').innerText;
    alert(`Loading Chlorophyll & SST Satellite details for ${zoneName}...`);
  }

  function handleStartNavigation() {
    const zoneName = document.getElementById('sheet-zone-id').innerText;
    const course = document.getElementById('telemetry-course').innerText;
    alert(`Course set to ${zoneName} at ${course}. Safety alerts active.`);
  }

  // Visual button feedback for controls
  document.getElementById('btn-recenter').addEventListener('click', () => {
    selectZone('vessel');
  });
  document.getElementById('btn-compass').addEventListener('click', () => {
